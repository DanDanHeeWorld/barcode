<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>바코드 합계기</title>

  <!-- iPhone/Android 공용 바코드 엔진 -->
  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
    onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js'">
  </script>

  <style>
    :root {
      --bg:#f3f4f6; --card:#fff; --text:#111827; --muted:#6b7280; --line:#e5e7eb;
      --primary:#111827; --good:#047857; --bad:#b91c1c; --warn:#92400e; --blue:#1d4ed8;
      --r:18px;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button,input { font:inherit; }
    .app {
      width:min(760px,100%);
      margin:0 auto;
      padding:12px 12px calc(28px + env(safe-area-inset-bottom));
    }
    .top {
      display:flex; align-items:center; justify-content:space-between;
      gap:10px; margin:3px 2px 12px;
    }
    h1 { font-size:22px; margin:0; letter-spacing:-.035em; }
    .badge {
      padding:7px 10px; border-radius:999px; background:#e5e7eb; color:#374151;
      font-size:12px; font-weight:800; white-space:nowrap;
    }
    .badge.good { background:#d1fae5; color:#065f46; }
    .badge.bad { background:#fee2e2; color:#991b1b; }
    .badge.warn { background:#fef3c7; color:#92400e; }

    .card {
      background:var(--card); border:1px solid var(--line); border-radius:var(--r);
      box-shadow:0 2px 10px rgba(17,24,39,.04);
      padding:15px; margin-bottom:11px;
    }
    .summary {
      display:grid; grid-template-columns:1fr auto; align-items:end; gap:10px 16px;
    }
    .label { color:var(--muted); font-size:12px; font-weight:800; }
    .total {
      font-size:clamp(36px,10vw,56px); font-weight:950; letter-spacing:-.055em;
      line-height:1.05; margin-top:4px;
    }
    .count { text-align:right; font-size:20px; font-weight:900; padding-bottom:5px; }

    .camera-frame {
      position:relative; width:100%; min-height:250px; background:#111827;
      border-radius:14px; overflow:hidden; margin-bottom:11px;
    }
    #reader {
      width:100%; min-height:250px; background:#111827;
    }
    #reader video {
      width:100% !important;
      max-height:62vh !important;
      object-fit:cover !important;
    }
    #reader img { display:none !important; }
    #reader__scan_region {
      min-height:250px !important;
      background:#111827 !important;
    }
    #reader__dashboard { display:none !important; }
    #cameraPlaceholder {
      position:absolute; inset:0; z-index:2;
      display:flex; align-items:center; justify-content:center;
      text-align:center; padding:30px 18px; color:#d1d5db;
      font-size:14px; line-height:1.55; pointer-events:none;
      background:#111827;
    }
    .scanGuide {
      position:absolute; z-index:3; left:7%; right:7%; top:50%; height:33%;
      transform:translateY(-50%);
      border:3px solid rgba(255,255,255,.92); border-radius:14px;
      pointer-events:none; display:none;
      box-shadow:0 0 0 2000px rgba(0,0,0,.18);
    }
    .scanLine {
      position:absolute; z-index:3; left:8%; right:8%; top:50%; height:2px;
      background:rgba(255,255,255,.85); pointer-events:none; display:none;
    }

    .buttons { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    button {
      border:0; border-radius:13px; padding:13px 12px; min-height:48px;
      font-weight:900; cursor:pointer; -webkit-tap-highlight-color:transparent;
    }
    button.primary { background:var(--primary); color:#fff; }
    button.secondary { background:#e5e7eb; color:#111827; }
    button.danger { background:#fee2e2; color:#991b1b; }
    button.photo { background:var(--blue); color:white; }
    button:disabled { opacity:.45; cursor:default; }
    .full { grid-column:1/-1; }

    .message {
      margin-top:10px; min-height:20px; color:var(--muted);
      font-size:13px; line-height:1.5;
    }
    .message.good { color:var(--good); font-weight:800; }
    .message.bad { color:var(--bad); font-weight:800; }
    .message.warn { color:var(--warn); font-weight:800; }

    .info {
      margin-top:10px; padding:10px 12px; border-radius:12px;
      background:#f9fafb; border:1px solid var(--line);
      color:#374151; font-size:12px; line-height:1.55;
    }
    .info b { font-weight:950; }

    .manual {
      display:grid; grid-template-columns:1fr auto; gap:8px; margin-top:11px;
    }
    input[type=text] {
      width:100%; border:1px solid #d1d5db; border-radius:12px;
      padding:12px 13px; min-height:48px; outline:none; background:white;
    }
    input[type=text]:focus {
      border-color:#4b5563; box-shadow:0 0 0 3px rgba(17,24,39,.07);
    }
    .hint { margin-top:9px; color:var(--muted); font-size:12px; line-height:1.55; }
    code { background:#f3f4f6; padding:2px 5px; border-radius:5px; }

    .section-title {
      display:flex; align-items:center; justify-content:space-between;
      gap:8px; margin-bottom:10px;
    }
    .section-title h2 { margin:0; font-size:17px; letter-spacing:-.02em; }

    .empty { color:var(--muted); font-size:14px; padding:18px 4px; text-align:center; }
    .item {
      display:grid; grid-template-columns:1fr auto auto; gap:8px 10px; align-items:center;
      border-top:1px solid var(--line); padding:11px 0;
    }
    .item:first-child { border-top:0; }
    .item-main { min-width:0; }
    .item-name { font-weight:900; line-height:1.3; }
    .item-meta {
      margin-top:3px; color:var(--muted); font-size:11px;
      overflow-wrap:anywhere; line-height:1.45;
    }
    .item-price { font-size:18px; font-weight:950; white-space:nowrap; }
    .icon-btn {
      width:38px; height:38px; min-height:38px; padding:0; border-radius:10px;
      background:#f3f4f6; color:#6b7280; font-size:17px;
    }

    .flash { animation:flash .45s ease-out; }
    @keyframes flash {
      0% { box-shadow:0 0 0 0 rgba(4,120,87,.45); }
      100% { box-shadow:0 0 0 14px rgba(4,120,87,0); }
    }

    @media(max-width:480px) {
      .app { padding-left:9px; padding-right:9px; }
      .card { padding:13px; }
      .manual { grid-template-columns:1fr; }
      .manual button { width:100%; }
    }
  </style>
</head>
<body>
<main class="app">
  <div class="top">
    <h1>바코드 합계기</h1>
    <div id="status" class="badge">대기</div>
  </div>

  <section id="summaryCard" class="card summary">
    <div>
      <div class="label">합계 · 1,000원 단위 절사 적용</div>
      <div id="total" class="total">0원</div>
    </div>
    <div>
      <div class="label" style="text-align:right">스캔 건수</div>
      <div id="count" class="count">0건</div>
    </div>
  </section>

  <section class="card">
    <div class="camera-frame">
      <div id="reader"></div>
      <div id="cameraPlaceholder">
        실시간 카메라를 시작하세요.<br>
        iPhone은 Safari, Android는 Chrome 사용을 권장합니다.
      </div>
      <div id="scanGuide" class="scanGuide"></div>
      <div id="scanLine" class="scanLine"></div>
    </div>

    <div class="buttons">
      <button id="startBtn" class="primary" type="button">실시간 카메라 시작</button>
      <button id="stopBtn" class="secondary" type="button" disabled>카메라 중지</button>
      <button id="photoBtn" class="photo full" type="button">사진 촬영으로 바코드 읽기</button>
      <input id="photoInput" type="file" accept="image/*" capture="environment" hidden />
    </div>

    <div id="message" class="message">바코드는 카메라와 평행하게, 화면 중앙에 크게 맞추면 잘 읽힙니다.</div>

    <div id="deviceInfo" class="info"></div>

    <div class="manual">
      <input id="manualCode" type="text" inputmode="numeric" autocomplete="off" maxlength="13"
             placeholder="바코드 13자리 직접 입력" />
      <button id="manualBtn" class="secondary" type="button">추가</button>
    </div>

    <div class="hint">
      바코드 규칙: <code>2 + PLU 5자리 + 가격 6자리 + 체크숫자</code><br>
      계산 규칙: 100원 단위 이하는 버리고 1,000원 단위로 합산합니다.<br>
      예: <code>2000131094006</code> → 표시가 109,400원 → <b>계산 109,000원</b>
    </div>
  </section>

  <section class="card">
    <div class="section-title">
      <h2>스캔 내역</h2>
      <button id="sampleBtn" class="secondary" type="button"
              style="min-height:36px;padding:7px 10px;font-size:12px">샘플 테스트</button>
    </div>

    <div id="list"></div>

    <div class="buttons" style="margin-top:11px">
      <button id="undoBtn" class="secondary" type="button">마지막 삭제</button>
      <button id="clearBtn" class="danger" type="button">전체 삭제</button>
      <button id="csvBtn" class="secondary full" type="button">CSV로 저장</button>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";

  const RULE = {
    requiredLength: 13,
    prefix: "2",
    pluStart: 1,
    pluLength: 5,
    priceStart: 6,
    priceLength: 6,
    roundUnit: 1000
  };

  const PRODUCT_NAMES = {
    "00013": "한우 부채살"
  };

  const STORAGE_KEY = "barcode_total_items_v3_thousand_floor";
  const SAME_CODE_GAP_MS = 1500;

  let items = loadItems();
  let scanner = null;
  let scanning = false;
  let audioCtx = null;
  let lastSeenCode = "";
  let lastSeenAt = 0;

  const $ = id => document.getElementById(id);
  const statusEl = $("status");
  const totalEl = $("total");
  const countEl = $("count");
  const listEl = $("list");
  const summaryCard = $("summaryCard");
  const messageEl = $("message");
  const cameraPlaceholder = $("cameraPlaceholder");
  const scanGuide = $("scanGuide");
  const scanLine = $("scanLine");
  const startBtn = $("startBtn");
  const stopBtn = $("stopBtn");
  const photoBtn = $("photoBtn");
  const photoInput = $("photoInput");
  const manualCode = $("manualCode");
  const manualBtn = $("manualBtn");
  const sampleBtn = $("sampleBtn");
  const undoBtn = $("undoBtn");
  const clearBtn = $("clearBtn");
  const csvBtn = $("csvBtn");
  const deviceInfo = $("deviceInfo");

  function money(n) {
    return Number(n || 0).toLocaleString("ko-KR") + "원";
  }

  function floorToUnit(n, unit) {
    return Math.floor(Number(n) / unit) * unit;
  }

  function setStatus(text, kind = "") {
    statusEl.textContent = text;
    statusEl.className = "badge" + (kind ? " " + kind : "");
  }

  function setMessage(text, kind = "") {
    messageEl.textContent = text;
    messageEl.className = "message" + (kind ? " " + kind : "");
  }

  function loadItems() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (_) {
      return [];
    }
  }

  function saveItems() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    } catch (_) {}
  }

  function validateEan13(code) {
    if (!/^\d{13}$/.test(code)) return false;
    const d = code.split("").map(Number);
    let sum = 0;
    for (let i = 0; i < 12; i++) {
      sum += d[i] * (i % 2 === 0 ? 1 : 3);
    }
    return ((10 - (sum % 10)) % 10) === d[12];
  }

  function parseBarcode(raw) {
    const code = String(raw || "").replace(/\D/g, "");

    if (code.length !== RULE.requiredLength) {
      return { ok:false, error:"13자리 EAN-13 바코드가 아닙니다." };
    }
    if (!validateEan13(code)) {
      return { ok:false, error:"EAN-13 체크숫자가 맞지 않습니다. 다시 읽어주세요." };
    }
    if (code[0] !== RULE.prefix) {
      return { ok:false, error:"현재 설정은 2로 시작하는 가격 포함 바코드만 계산합니다." };
    }

    const plu = code.slice(RULE.pluStart, RULE.pluStart + RULE.pluLength);
    const rawPrice = Number(code.slice(RULE.priceStart, RULE.priceStart + RULE.priceLength));

    if (!Number.isInteger(rawPrice) || rawPrice <= 0) {
      return { ok:false, error:"바코드에서 유효한 가격을 찾지 못했습니다." };
    }

    const calcPrice = floorToUnit(rawPrice, RULE.roundUnit);

    return {
      ok:true,
      code,
      plu,
      rawPrice,
      calcPrice,
      name: PRODUCT_NAMES[plu] || ("PLU " + plu)
    };
  }

  function addBarcode(raw, source = "scan") {
    const r = parseBarcode(raw);

    if (!r.ok) {
      setStatus("오류", "bad");
      setMessage(r.error, "bad");
      badBuzz();
      return false;
    }

    const now = new Date();
    items.push({
      id: now.getTime().toString(36) + Math.random().toString(36).slice(2,7),
      code:r.code,
      plu:r.plu,
      rawPrice:r.rawPrice,
      price:r.calcPrice,
      name:r.name,
      source,
      time:now.toISOString()
    });

    saveItems();
    render();

    setStatus("추가됨", "good");
    if (r.rawPrice !== r.calcPrice) {
      setMessage(`${r.name} · ${money(r.rawPrice)} → ${money(r.calcPrice)} 계산`, "good");
    } else {
      setMessage(`${r.name} · ${money(r.calcPrice)} 추가`, "good");
    }

    goodBuzz();
    summaryCard.classList.remove("flash");
    void summaryCard.offsetWidth;
    summaryCard.classList.add("flash");
    return true;
  }

  function handleDetected(decodedText, source = "camera") {
    const code = String(decodedText || "").replace(/\D/g, "");
    const now = Date.now();

    if (code === lastSeenCode && now - lastSeenAt < SAME_CODE_GAP_MS) {
      lastSeenAt = now;
      return;
    }

    lastSeenCode = code;
    lastSeenAt = now;
    addBarcode(code, source);
  }

  function render() {
    const total = items.reduce((sum, item) => sum + Number(item.price || 0), 0);
    totalEl.textContent = money(total);
    countEl.textContent = items.length.toLocaleString("ko-KR") + "건";

    undoBtn.disabled = items.length === 0;
    clearBtn.disabled = items.length === 0;
    csvBtn.disabled = items.length === 0;

    if (items.length === 0) {
      listEl.innerHTML = '<div class="empty">아직 스캔한 항목이 없습니다.</div>';
      return;
    }

    listEl.innerHTML = items.slice().reverse().map(item => {
      const t = new Date(item.time);
      const hhmm = isNaN(t)
        ? ""
        : t.toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit" });

      const raw = Number(item.rawPrice ?? item.price ?? 0);
      const calc = Number(item.price ?? 0);
      const priceInfo = raw !== calc
        ? `표시 ${money(raw)} → 계산 ${money(calc)}`
        : `계산 ${money(calc)}`;

      return `
        <div class="item">
          <div class="item-main">
            <div class="item-name">${esc(item.name || ("PLU " + item.plu))}</div>
            <div class="item-meta">${esc(item.code)} · ${esc(hhmm)}<br>${esc(priceInfo)}</div>
          </div>
          <div class="item-price">${money(calc)}</div>
          <button class="icon-btn" type="button" data-delete="${esc(item.id)}" aria-label="삭제">×</button>
        </div>`;
    }).join("");
  }

  function esc(v) {
    return String(v ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function unlockAudio() {
    try {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    } catch (_) {}
  }

  function beep(freq = 880, duration = 0.08) {
    try {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.055, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (_) {}
  }

  function goodBuzz() {
    beep(920, 0.08);
    try { navigator.vibrate?.(70); } catch (_) {}
  }

  function badBuzz() {
    beep(220, 0.12);
    try { navigator.vibrate?.([80,50,80]); } catch (_) {}
  }

  function libraryReady() {
    return !!(window.Html5Qrcode && window.Html5QrcodeSupportedFormats);
  }

  function detectDevice() {
    const ua = navigator.userAgent || "";
    const isIOS =
      /iPhone|iPad|iPod/i.test(ua) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    const isAndroid = /Android/i.test(ua);

    if (!window.isSecureContext) {
      deviceInfo.innerHTML =
        "<b>HTTPS가 아닙니다.</b> 실시간 카메라는 HTTPS에서 사용하세요.";
      deviceInfo.style.color = "#991b1b";
      return;
    }

    if (isIOS) {
      deviceInfo.innerHTML =
        "<b>iPhone/iPad 감지.</b> Safari에서 실시간 스캔을 사용하도록 수정한 버전입니다.";
    } else if (isAndroid) {
      deviceInfo.innerHTML =
        "<b>Android 감지.</b> Chrome에서 사용하는 것을 권장합니다.";
    } else {
      deviceInfo.innerHTML =
        "<b>HTTPS 연결 정상.</b> 카메라 권한을 허용하면 실시간 스캔을 사용할 수 있습니다.";
    }
  }

  function cameraErrorText(err) {
    const name = String(err?.name || "");
    const msg = String(err?.message || err || "");

    if (/NotAllowedError|Permission|denied|not allowed/i.test(name + " " + msg)) {
      return "카메라 권한이 차단되었습니다. iPhone에서는 설정 → Safari → 카메라 또는 주소창의 사이트 설정에서 카메라를 허용한 뒤 다시 시도하세요.";
    }
    if (/NotFoundError|Requested device not found|no cameras/i.test(name + " " + msg)) {
      return "사용 가능한 카메라를 찾지 못했습니다.";
    }
    if (/NotReadableError|TrackStartError|Could not start/i.test(name + " " + msg)) {
      return "다른 앱이 카메라를 사용 중일 수 있습니다. 카메라 앱이나 영상통화 앱을 닫고 다시 시도하세요.";
    }
    if (!window.isSecureContext) {
      return "실시간 카메라는 HTTPS에서 실행해야 합니다.";
    }
    return "카메라를 시작하지 못했습니다. Safari를 완전히 닫았다가 다시 열거나 사진 촬영 방식을 사용해 주세요.";
  }

  function scanConfig() {
    return {
      fps: 12,
      qrbox: (viewfinderWidth, viewfinderHeight) => {
        const width = Math.min(Math.floor(viewfinderWidth * 0.88), 460);
        const height = Math.min(
          Math.max(Math.floor(width * 0.34), 105),
          Math.floor(viewfinderHeight * 0.55)
        );
        return { width, height };
      },
      aspectRatio: 1.7777778,
      disableFlip: true
    };
  }

  function newScanner() {
    return new Html5Qrcode(
      "reader",
      {
        formatsToSupport: [Html5QrcodeSupportedFormats.EAN_13]
      },
      false
    );
  }

  async function tryStartWithFacingMode() {
    scanner = newScanner();
    await scanner.start(
      { facingMode:"environment" },
      scanConfig(),
      decodedText => handleDetected(decodedText, "camera"),
      () => {}
    );
  }

  async function tryStartWithCameraId() {
    try {
      if (scanner) {
        try { await scanner.clear(); } catch (_) {}
      }
    } catch (_) {}

    const cameras = await Html5Qrcode.getCameras();
    if (!cameras || cameras.length === 0) {
      throw new Error("No cameras found");
    }

    const rear =
      cameras.find(c => /back|rear|environment|후면/i.test(c.label || "")) ||
      cameras[cameras.length - 1];

    scanner = newScanner();
    await scanner.start(
      rear.id,
      scanConfig(),
      decodedText => handleDetected(decodedText, "camera"),
      () => {}
    );
  }

  async function startCamera() {
    unlockAudio();
    if (scanning) return;

    if (!window.isSecureContext) {
      setStatus("HTTPS 필요", "bad");
      setMessage("실시간 카메라는 HTTPS 주소에서 열어야 합니다.", "bad");
      badBuzz();
      return;
    }

    if (!libraryReady()) {
      setStatus("엔진 로드 실패", "bad");
      setMessage("바코드 엔진을 불러오지 못했습니다. 인터넷 연결을 확인하고 페이지를 새로고침하세요.", "bad");
      badBuzz();
      return;
    }

    startBtn.disabled = true;
    setStatus("카메라 연결 중");
    setMessage("카메라 권한 요청이 나오면 '허용'을 누르세요.");
    cameraPlaceholder.style.display = "none";

    try {
      try {
        await tryStartWithFacingMode();
      } catch (firstError) {
        try {
          if (scanner) {
            try { await scanner.stop(); } catch (_) {}
            try { await scanner.clear(); } catch (_) {}
          }
          scanner = null;
        } catch (_) {}

        await tryStartWithCameraId();
      }

      scanning = true;
      stopBtn.disabled = false;
      scanGuide.style.display = "block";
      scanLine.style.display = "block";

      setStatus("스캔 중", "good");
      setMessage("바코드 전체가 흰 사각형 안에 들어오도록 맞추세요.", "good");
    } catch (err) {
      scanning = false;
      startBtn.disabled = false;
      stopBtn.disabled = true;
      scanGuide.style.display = "none";
      scanLine.style.display = "none";
      cameraPlaceholder.style.display = "flex";

      try {
        if (scanner) {
          try { await scanner.stop(); } catch (_) {}
          try { await scanner.clear(); } catch (_) {}
        }
      } catch (_) {}
      scanner = null;

      setStatus("카메라 오류", "bad");
      setMessage(cameraErrorText(err), "bad");
      badBuzz();
    }
  }

  async function stopCamera(updateUi = true) {
    scanning = false;

    try {
      if (scanner) {
        try { await scanner.stop(); } catch (_) {}
        try { await scanner.clear(); } catch (_) {}
      }
    } catch (_) {}

    scanner = null;
    startBtn.disabled = false;
    stopBtn.disabled = true;
    scanGuide.style.display = "none";
    scanLine.style.display = "none";
    cameraPlaceholder.style.display = "flex";

    if (updateUi) {
      setStatus("대기");
      setMessage("실시간 카메라를 중지했습니다.");
    }
  }

  async function scanPhoto(file) {
    unlockAudio();
    if (!file) return;

    if (!libraryReady()) {
      setStatus("엔진 로드 실패", "bad");
      setMessage("바코드 엔진을 불러오지 못했습니다. 인터넷 연결 후 다시 시도하세요.", "bad");
      photoInput.value = "";
      return;
    }

    if (scanning) {
      await stopCamera(false);
    }

    setStatus("사진 판독 중");
    setMessage("사진에서 EAN-13 바코드를 찾고 있습니다.");

    let photoScanner = null;

    try {
      photoScanner = newScanner();
      const decodedText = await photoScanner.scanFile(file, false);
      handleDetected(decodedText, "photo");
    } catch (_) {
      setStatus("판독 실패", "bad");
      setMessage("사진에서 바코드를 읽지 못했습니다. 바코드가 크게 보이도록 가까이 촬영해 주세요.", "bad");
      badBuzz();
    } finally {
      try { await photoScanner?.clear(); } catch (_) {}
      photoInput.value = "";
      cameraPlaceholder.style.display = "flex";
    }
  }

  function deleteById(id) {
    const index = items.findIndex(x => x.id === id);
    if (index < 0) return;
    items.splice(index, 1);
    saveItems();
    render();
    setStatus("삭제됨");
    setMessage("항목 1개를 삭제했습니다.");
  }

  function undoLast() {
    if (!items.length) return;
    items.pop();
    saveItems();
    render();
    setStatus("삭제됨");
    setMessage("마지막 항목을 삭제했습니다.");
  }

  function clearAll() {
    if (!items.length) return;
    if (!confirm("스캔 내역과 합계를 모두 지울까요?")) return;
    items = [];
    saveItems();
    render();
    setStatus("초기화됨");
    setMessage("모든 내역을 삭제했습니다.");
  }

  function exportCsv() {
    if (!items.length) return;

    const rows = [
      ["시간","상품","PLU","바코드","표시가격","계산가격"],
      ...items.map(item => [
        new Date(item.time).toLocaleString("ko-KR"),
        item.name,
        item.plu,
        item.code,
        item.rawPrice ?? item.price,
        item.price
      ])
    ];

    const csv = "\ufeff" + rows.map(row =>
      row.map(v => '"' + String(v ?? "").replaceAll('"','""') + '"').join(",")
    ).join("\r\n");

    const blob = new Blob([csv], { type:"text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const d = new Date();
    const ymd =
      d.getFullYear() +
      String(d.getMonth()+1).padStart(2,"0") +
      String(d.getDate()).padStart(2,"0");

    a.href = url;
    a.download = "barcode_" + ymd + ".csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  startBtn.addEventListener("click", startCamera);
  stopBtn.addEventListener("click", () => stopCamera(true));

  photoBtn.addEventListener("click", () => {
    unlockAudio();
    photoInput.click();
  });
  photoInput.addEventListener("change", () => scanPhoto(photoInput.files?.[0]));

  manualBtn.addEventListener("click", () => {
    unlockAudio();
    if (addBarcode(manualCode.value, "manual")) {
      manualCode.value = "";
    }
  });
  manualCode.addEventListener("keydown", e => {
    if (e.key === "Enter") manualBtn.click();
  });

  sampleBtn.addEventListener("click", () => {
    unlockAudio();
    addBarcode("2000131094006", "sample");
  });

  undoBtn.addEventListener("click", undoLast);
  clearBtn.addEventListener("click", clearAll);
  csvBtn.addEventListener("click", exportCsv);

  listEl.addEventListener("click", e => {
    const btn = e.target.closest("[data-delete]");
    if (btn) deleteById(btn.dataset.delete);
  });

  window.addEventListener("pagehide", () => {
    if (scanning) stopCamera(false);
  });

  detectDevice();
  render();
})();
</script>
</body>
</html>
